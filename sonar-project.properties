# Everything in this file is re-read on every analysis, because the instance it points at
# is created for one analysis and destroyed with it. Nothing here is configuration that
# survives, so anything that belongs to the instance rather than to the project has to be
# re-declared on every boot or it is lost with the database.
sonar.projectKey=hanko
sonar.projectName=Hanko
sonar.sources=src,scripts
sonar.exclusions=coverage/**,dist/**,.wrangler/**,node_modules/**,**/*.test.ts,**/*.test.tsx
sonar.sourceEncoding=UTF-8

# The tree reaches across itself through aliases rather than relative paths, and the
# analyser resolves them out of the TypeScript configuration. Without this every import
# in the project is reported as unresolved and the rule counts become fiction.
sonar.typescript.tsconfigPaths=tsconfig.json,tsconfig.worker.json

# vitest already writes lcov, so reporting test coverage costs nothing to wire up.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The scanner exits zero whatever the gate says unless it is told to wait for the
# verdict, and an exit code is the only thing that outlives the instance.
sonar.qualitygate.wait=true
